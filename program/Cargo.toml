[package]
name = "audren"
version = "0.1.0"
edition = "2021"
publish = false
description = "Audren — Institutional Confidential & Full-Private Settlement Program on Solana (sBPFv3)."

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
audren-core = { path = "../crates/audren-core" }
bytemuck = "1.25.0"
solana-account-info = "=3.1.1"
solana-address = { version = "~2.7.0", features = ["curve25519"] }
solana-cpi = "=3.1.0"
solana-curve25519 = "=4.0.1"
solana-instruction = "3.4"
solana-msg = "=3.1.0"
solana-program-entrypoint = "=3.1.1"
solana-program-error = "=3.0.1"
solana-rent = { version = "4.0.0", features = ["sysvar"] }
solana-sha256-hasher = "3.1.0"
solana-system-interface = { version = "=3.3.0", features = ["bincode"] }
solana-zk-elgamal-proof-interface = "=1.0.0"
spl-token-2022-interface = "=3.1.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic"))'] }

# Isolated on-chain workspace with its own Cargo.lock (`programs/README.md`, one layout per program).
[workspace]
resolver = "2"
members = ["."]

[profile.release]
overflow-checks = true
opt-level = 3
lto = false
codegen-units = 1

[profile.dev]
overflow-checks = true
