[package]
name = "audren"
version = "1.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Audren — Multi-Asset Global Shielded Pool (BN254 Groth16) and Protocol-Agnostic DeFi Execution Program on Solana (Pinocchio + sBPFv3)."

[lib]
name = "audren"
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
audren-core = { path = "../crates/audren-core" }
groth16-solana = { version = "=0.3.1", default-features = false }
pinocchio = { version = "=0.11.1", default-features = false, features = ["copy", "cpi", "sha2"] }
pinocchio-system = "=0.6.1"
solana-poseidon = { version = "=5.0.1", default-features = false }

[target.'cfg(not(any(target_os = "solana", target_arch = "bpf")))'.dependencies]
solana-address = { version = "2", features = ["curve25519"] }
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(target_arch, values("bpf"))', 'cfg(feature, values("custom-heap", "custom-panic"))'] }

# Isolated on-chain workspace with its own Cargo.lock (pinned sBPFv3 dependency graph).
[workspace]
resolver = "2"
members = ["."]

[workspace.metadata.cli]
solana = "4.3.0"

[profile.release]
overflow-checks = true
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
overflow-checks = true
