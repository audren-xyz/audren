# Host workspace: shared core library, BN254 Groth16 circuits, Rust SDK, and UniFFI mobile facade.
# Each deployed on-chain program builds in its own isolated workspace (`program/`, `tests/mock-router/`,
# `tests/mock-hook/`) with its own pinned `Cargo.lock` for deterministic sBPFv3 builds.
[workspace]
resolver = "2"
members = [
    "crates/audren-core",
    "crates/audren-circuits",
    "crates/client",
    "crates/audren-ffi",
]
exclude = ["program", "tests/mock-router", "tests/mock-hook"]

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.dev]
overflow-checks = true

# Optimize BN254 Poseidon parameter table construction and field bigint helpers in dev/test builds
# so `light_poseidon::get_poseidon_parameters` (~1.21 MiB unoptimized stack frame) never overflows
# 2 MiB Rust worker threads or 512 KiB / 1 MiB mobile FFI dev-build stacks.
[profile.dev.package.light-poseidon]
opt-level = 2

[profile.dev.package.ark-ff]
opt-level = 2
