# Host workspace: shared core library and client SDK (prover, pure-RPC/WS scanner, router-agnostic swap builder).
# Each deployed on-chain program builds in its own isolated workspace (`program/`, `tests/mock-router/`)
# with its own pinned `Cargo.lock` for deterministic sBPFv3 builds.
[workspace]
resolver = "2"
members = ["crates/audren-core", "crates/client", "crates/audren-ffi"]
exclude = ["program", "tests/mock-router"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.dev]
overflow-checks = true
