# Host workspace: shared core library and client SDK (prover, pure-RPC/WS scanner, router-agnostic swap builder).
# The deployed on-chain program builds in its own isolated workspace (`program/`) with its own Cargo.lock,
# keeping on-chain build dependencies separate from the host client.
[workspace]
resolver = "2"
members = ["crates/audren-core", "crates/client"]
exclude = ["program", "tests/mock-router"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.dev]
overflow-checks = true
