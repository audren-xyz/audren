version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Block breaking major bumps (arkworks 0.5, Agave 4.3, crypto primitives, Cargo 0.x majors).
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      # Exact-pinned to Agave 4.3.0 / sBPFv3 test runtime.
      - dependency-name: litesvm
      - dependency-name: agave-feature-set
  - package-ecosystem: npm
    directory: /packages/sdk
    schedule:
      interval: weekly
    groups:
      sdk-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
  - package-ecosystem: npm
    directory: /apps/relay
    schedule:
      interval: weekly
    groups:
      relay-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      web-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
