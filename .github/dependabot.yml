version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Upstream ark-relations 0.5.1 (used by the frozen BN254 Groth16 circuit)
      # requires tracing-subscriber ^0.2; upgrading to 0.3 requires breaking arkworks 0.6.
      # Audren never logs untrusted input through tracing-subscriber.
      - dependency-name: tracing-subscriber
        update-types:
          - version-update:semver-major
  - package-ecosystem: npm
    directory: /packages/sdk
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /apps/relay
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
