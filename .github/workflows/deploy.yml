name: CD (Deploy Production)

permissions:
  contents: read

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: 'Workers to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - web
          - relay

concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Check Production Deploy Credentials
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    outputs:
      deploy_relay: ${{ steps.check.outputs.deploy_relay }}
      deploy_web: ${{ steps.check.outputs.deploy_web }}
    steps:
      - name: Validate Cloudflare CI/CD secrets
        id: check
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_WEB_CFG: ${{ secrets.WRANGLER_WEB_PROD_CONFIG != '' }}
          HAS_RELAY_CFG: ${{ secrets.WRANGLER_RELAY_PROD_CONFIG != '' }}
          TARGET: ${{ github.event.inputs.target || 'all' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          WANT_RELAY=false
          WANT_WEB=false
          if [[ "$TARGET" == "all" || "$TARGET" == "relay" ]]; then WANT_RELAY=true; fi
          if [[ "$TARGET" == "all" || "$TARGET" == "web" ]]; then WANT_WEB=true; fi

          MISSING=()
          [[ "$HAS_CF_TOKEN" != "true" ]] && MISSING+=("CLOUDFLARE_API_TOKEN")
          [[ "$HAS_CF_ACCOUNT" != "true" ]] && MISSING+=("CLOUDFLARE_ACCOUNT_ID")
          [[ "$WANT_WEB" == "true" && "$HAS_WEB_CFG" != "true" ]] && MISSING+=("WRANGLER_WEB_PROD_CONFIG")
          [[ "$WANT_RELAY" == "true" && "$HAS_RELAY_CFG" != "true" ]] && MISSING+=("WRANGLER_RELAY_PROD_CONFIG")

          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "### Production CD Skipped (Missing GitHub \`production\` Environment Secrets)" >> "$GITHUB_STEP_SUMMARY"
            echo "Configure the following secret(s) in **Settings → Environments → production**:" >> "$GITHUB_STEP_SUMMARY"
            for s in "${MISSING[@]}"; do
              echo "- \`$s\`" >> "$GITHUB_STEP_SUMMARY"
            done
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "::error::Missing production environment secret(s): ${MISSING[*]}"
              exit 1
            fi
            echo "deploy_relay=false" >> "$GITHUB_OUTPUT"
            echo "deploy_web=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy_relay=$WANT_RELAY" >> "$GITHUB_OUTPUT"
          echo "deploy_web=$WANT_WEB" >> "$GITHUB_OUTPUT"

  deploy-relay:
    name: Deploy relay.audren.xyz
    needs: preflight
    if: needs.preflight.outputs.deploy_relay == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://relay.audren.xyz
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install, verify & deploy audren-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_RELAY_PROD_CONFIG: ${{ secrets.WRANGLER_RELAY_PROD_CONFIG }}
        run: |
          set -euo pipefail
          pnpm --dir packages/sdk install --frozen-lockfile
          pnpm --dir packages/sdk build
          pnpm --dir apps/relay install --frozen-lockfile
          pnpm --dir apps/relay typecheck
          pnpm --dir apps/relay test
          umask 077
          printf '%s\n' "$WRANGLER_RELAY_PROD_CONFIG" > apps/relay/wrangler.prod.jsonc
          trap 'rm -f apps/relay/wrangler.prod.jsonc' EXIT
          (cd apps/relay && CI=1 pnpm exec wrangler deploy --config wrangler.prod.jsonc)
      - name: Post-deploy live relay verification
        run: |
          set -euo pipefail
          curl -fsSL https://relay.audren.xyz/health | grep -q '"ok":true'
          curl -fsSL "https://relay.audren.xyz/v1/info?cluster=mainnet" | grep -q '"configured":true'

  deploy-web:
    name: Deploy audren.xyz
    needs: preflight
    if: needs.preflight.outputs.deploy_web == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://audren.xyz
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build, verify & deploy audren-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_WEB_PROD_CONFIG: ${{ secrets.WRANGLER_WEB_PROD_CONFIG }}
        run: |
          set -euo pipefail
          pnpm --dir packages/sdk install --frozen-lockfile
          pnpm --dir packages/sdk build
          pnpm --dir apps/web install --frozen-lockfile
          pnpm --dir apps/web check
          pnpm --dir apps/web e2e:audit
          umask 077
          printf '%s\n' "$WRANGLER_WEB_PROD_CONFIG" > apps/web/wrangler.prod.jsonc
          trap 'rm -f apps/web/wrangler.prod.jsonc' EXIT
          (cd apps/web && CI=1 pnpm exec wrangler deploy --config wrangler.prod.jsonc)
      - name: Post-deploy live audren.xyz verification
        env:
          BASE_URL: https://audren.xyz
        run: |
          set -euo pipefail
          pnpm --dir apps/web e2e:api
          pnpm --dir apps/web e2e:ui
          LIVE_WASM=$(curl -fsSL https://audren.xyz/wasm/audren_circuits.wasm | sha256sum | awk '{print $1}')
          REPO_WASM=$(sha256sum packages/sdk/wasm/audren_circuits.wasm | awk '{print $1}')
          test "$LIVE_WASM" = "$REPO_WASM"
