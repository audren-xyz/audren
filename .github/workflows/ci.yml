name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-and-docs:
    name: Zero-Drift & Docs Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify IDL, 4-language SDKs, Relayer, Web protocol.ts, docs & toolchain parity
        run: python3 idl/verify-idl.py
      - name: Syntax-check operator & mobile SDK scripts
        run: |
          bash -n scripts/upgrade-program.sh
          bash -n scripts/build-mobile-sdks.sh

  rust-and-kotlin:
    name: Rust SDK, FFI & Kotlin (Android/JVM) Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            program -> program/target
            tests/mock-router -> tests/mock-router/target
      - name: Check isolated sBPFv3 program manifest
        run: |
          cargo check --manifest-path program/Cargo.toml
          cargo check --manifest-path program/Cargo.toml --features no-entrypoint
          cargo check --manifest-path program/Cargo.toml --tests
      - name: Check isolated mock-router manifest
        run: cargo check --manifest-path tests/mock-router/Cargo.toml
      - name: Check host workspace & tests
        run: cargo check --workspace --tests
      - name: Run Rust & FFI canonical conformance tests (spec/test-vectors.json)
        run: |
          cargo test -p audren-client --test conformance_vectors
          cargo test -p audren-ffi --test conformance_ffi
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build deterministic sBPFv3 audren.so & audren_mock_router.so + run ALL LiteSVM & Cross-SDK suites
        env:
          AUDREN_REQUIRE_SBF: '1'
          AUDREN_REQUIRE_MOCK_ROUTER: '1'
        run: |
          pnpm --dir packages/sdk install --frozen-lockfile
          pnpm --dir packages/sdk build
          mkdir -p target/deploy
          docker run --rm --entrypoint bash \
            -v "${{ github.workspace }}:/build" \
            -w /build \
            solanafoundation/solana-verifiable-build@sha256:12fd4c0a0790f0fc41ef74b0cdb6bccc167ba6137eb1adb749bac649481c86bd \
            -c "CARGO_TARGET_DIR=/tmp/sbf-target cargo-build-sbf --manifest-path /build/program/Cargo.toml --sbf-out-dir /build/target/deploy --arch v3 --tools-version v1.57 && CARGO_TARGET_DIR=/tmp/sbf-target cargo-build-sbf --manifest-path /build/tests/mock-router/Cargo.toml --sbf-out-dir /build/target/deploy --arch v3 --tools-version v1.57 && chmod 644 /build/target/deploy/audren.so /build/target/deploy/audren_mock_router.so"
          python3 scripts/build-sbf.py --check-elf target/deploy/audren.so
          python3 scripts/build-sbf.py --check-elf target/deploy/audren_mock_router.so
          cargo test -p audren-client --test litesvm_e2e -- --nocapture
          cargo test -p audren-ffi --test cross_sdk_litesvm -- --nocapture
      - name: Build native libaudren_ffi.so (release)
        run: cargo build -p audren-ffi --release
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
      - name: Run Kotlin (Android/JVM) SDK conformance tests
        working-directory: packages/kotlin
        run: gradle test --no-daemon

  swift-sdk:
    name: Swift (iOS/macOS) SDK Conformance
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
      - name: Build native libaudren_ffi.dylib (release)
        run: cargo build -p audren-ffi --release
      - name: Run Swift SDK conformance tests (spec/test-vectors.json)
        working-directory: packages/swift
        run: swift test

  typescript-and-web:
    name: TypeScript SDK, Relayer & Web App Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Typecheck & run @audren/sdk + @audren/sdk/prover conformance tests
        run: |
          pnpm --dir packages/sdk install --frozen-lockfile
          pnpm --dir packages/sdk typecheck
          pnpm --dir packages/sdk test
      - name: Typecheck apps/relay
        run: |
          pnpm --dir apps/relay install --frozen-lockfile
          pnpm --dir apps/relay typecheck
      - name: Typecheck, lint & build apps/web
        run: |
          pnpm --dir apps/web install --frozen-lockfile
          pnpm --dir apps/web check
