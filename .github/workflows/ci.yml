name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-and-docs:
    name: Zero-Drift & Docs Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify IDL, 4-language SDKs, WASM prover, Relayer, Web protocol.ts, docs & toolchain parity
        run: python3 idl/verify-idl.py
      - name: Syntax-check operator & mobile SDK scripts
        run: |
          bash -n scripts/upgrade-program.sh
          bash -n scripts/build-mobile-sdks.sh

  rust-and-kotlin:
    name: Rust Circuits, sBPFv3, SDK, FFI & Kotlin (Android/JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            program -> program/target
            tests/mock-router -> tests/mock-router/target
            tests/mock-hook -> tests/mock-hook/target
      - name: Check, clippy & unit-test isolated sBPFv3 program manifests
        run: |
          cargo check --manifest-path program/Cargo.toml
          cargo check --manifest-path program/Cargo.toml --features no-entrypoint
          cargo clippy --manifest-path program/Cargo.toml -- -D warnings
          cargo clippy --manifest-path program/Cargo.toml --features no-entrypoint -- -D warnings
          cargo test --manifest-path program/Cargo.toml
          cargo check --manifest-path tests/mock-router/Cargo.toml
          cargo clippy --manifest-path tests/mock-router/Cargo.toml -- -D warnings
          cargo check --manifest-path tests/mock-hook/Cargo.toml
          cargo clippy --manifest-path tests/mock-hook/Cargo.toml -- -D warnings
      - name: Check, clippy & run host core/circuit/ceremony/conformance suites
        run: |
          cargo check --workspace --tests
          cargo clippy --workspace --tests -- -D warnings
          cargo test -p audren-core
          cargo test -p audren-circuits --release
          cargo run -p audren-circuits --release --bin ceremony -- verify --transcript ceremony/transcript.json --pk crates/audren-circuits/params/audren_joinsplit.pk --vk-rs program/src/vk_generated.rs
          cargo test -p audren-client --release --lib
          cargo test -p audren-client --release --test conformance_vectors
          cargo test -p audren-ffi --release --test conformance_ffi
      - name: Verify wasm32 Groth16 prover builds cleanly and matches committed WASM bytes
        run: |
          CARGO_HOME_EFF="${CARGO_HOME:-$HOME/.cargo}"
          CARGO_INCREMENTAL=0 RUSTFLAGS="--remap-path-prefix=${CARGO_HOME_EFF}=/cargo --remap-path-prefix=$(pwd)=/audren" \
            cargo build -p audren-circuits --target wasm32-unknown-unknown --release --no-default-features --features wasm
          BUILT_SHA=$(sha256sum target/wasm32-unknown-unknown/release/audren_circuits.wasm | awk '{print $1}')
          SDK_SHA=$(sha256sum packages/sdk/wasm/audren_circuits.wasm | awk '{print $1}')
          WEB_SHA=$(sha256sum apps/web/public/wasm/audren_circuits.wasm | awk '{print $1}')
          echo "WASM SHA-256: built=$BUILT_SHA sdk=$SDK_SHA web=$WEB_SHA"
          test "$BUILT_SHA" = "$SDK_SHA"
          test "$BUILT_SHA" = "$WEB_SHA"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build deterministic sBPFv3 ELFs & run ALL LiteSVM & Cross-SDK suites
        env:
          AUDREN_REQUIRE_SBF: '1'
          AUDREN_REQUIRE_MOCK_ROUTER: '1'
        run: |
          pnpm --dir packages/sdk install --frozen-lockfile
          pnpm --dir packages/sdk build
          mkdir -p target/deploy
          docker run --rm --entrypoint bash \
            -v "${{ github.workspace }}:/build" \
            -w /build \
            solanafoundation/solana-verifiable-build@sha256:12fd4c0a0790f0fc41ef74b0cdb6bccc167ba6137eb1adb749bac649481c86bd \
            -c "CARGO_TARGET_DIR=/tmp/sbf-target cargo-build-sbf --manifest-path /build/program/Cargo.toml --sbf-out-dir /build/target/deploy --arch v3 --tools-version v1.57 -- --locked && CARGO_TARGET_DIR=/tmp/sbf-target cargo-build-sbf --manifest-path /build/tests/mock-router/Cargo.toml --sbf-out-dir /build/target/deploy --arch v3 --tools-version v1.57 -- --locked && CARGO_TARGET_DIR=/tmp/sbf-target cargo-build-sbf --manifest-path /build/tests/mock-hook/Cargo.toml --sbf-out-dir /build/target/deploy --arch v3 --tools-version v1.57 -- --locked && chmod 644 /build/target/deploy/audren.so /build/target/deploy/audren_mock_router.so /build/target/deploy/audren_mock_hook.so"
          python3 scripts/build-sbf.py --check-elf target/deploy/audren.so
          python3 scripts/build-sbf.py --check-elf target/deploy/audren_mock_router.so
          python3 scripts/build-sbf.py --check-elf target/deploy/audren_mock_hook.so
          cargo test -p audren-client --release --test litesvm_e2e -- --nocapture
          cargo test -p audren-ffi --release --test cross_sdk_litesvm -- --nocapture
      - name: Build native libaudren_ffi.so (release)
        run: cargo build -p audren-ffi --release
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
      - name: Run Kotlin (Android/JVM) SDK conformance tests
        working-directory: packages/kotlin
        run: gradle test --no-daemon

  swift-sdk:
    name: Swift (iOS/macOS) SDK Conformance
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
      - name: Build native libaudren_ffi.dylib (release)
        run: cargo build -p audren-ffi --release
      - name: Run Swift SDK conformance tests (spec/test-vectors.json)
        working-directory: packages/swift
        run: swift test

  typescript-and-web:
    name: TypeScript SDK, Relayer & Web App Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Typecheck & run @audren/sdk + @audren/sdk/prover WASM conformance tests
        run: |
          pnpm --dir packages/sdk install --frozen-lockfile
          pnpm --dir packages/sdk typecheck
          pnpm --dir packages/sdk test
      - name: Typecheck & unit-test apps/relay
        run: |
          pnpm --dir apps/relay install --frozen-lockfile
          pnpm --dir apps/relay typecheck
          pnpm --dir apps/relay test
      - name: Typecheck, lint, build & WASM-audit apps/web
        run: |
          pnpm --dir apps/web install --frozen-lockfile
          pnpm --dir apps/web check
          pnpm --dir apps/web e2e:audit
