[package]
name = "audren-mock-router"
version = "1.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Minimal Pinocchio sBPFv3 mock target router (AMM, lending/yield, and adversarial exploit harness) for Audren ExecViaEscrow integration tests."

[lib]
name = "audren_mock_router"
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = { version = "=0.11.1", default-features = false, features = ["copy", "cpi", "sha2"] }
pinocchio-system = "=0.6.1"

[target.'cfg(not(any(target_os = "solana", target_arch = "bpf")))'.dependencies]
solana-address = { version = "2", features = ["curve25519"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(target_arch, values("bpf"))'] }

[workspace]
resolver = "2"
members = ["."]

[workspace.metadata.cli]
solana = "4.3.0"

[profile.release]
overflow-checks = true
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
overflow-checks = true
