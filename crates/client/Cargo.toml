[package]
name = "audren-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Audren Rust SDK: BN254 Groth16 prover, CompactWalletStore ordinary-RPC scanner, FullViewingKey, SelectiveDisclosureProof, DefiSessionKeypair, and ExecViaEscrow DeFi builder."

[dependencies]
ark-bn254 = { version = "=0.5.0", default-features = false, features = ["curve"] }
ark-ff = { version = "=0.5.0", default-features = false }
ark-groth16 = { version = "=0.5.0", default-features = false, features = ["std"] }
audren-circuits = { path = "../audren-circuits" }
audren-core = { path = "../audren-core" }
bs58 = "0.5"
chacha20poly1305 = "0.10"
ed25519-dalek = "3"
hkdf = "0.12"
rand = { version = "0.8.5", default-features = false, features = ["std", "std_rng", "getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-address = { version = "~2.7.0", features = ["copy", "curve25519", "std"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1.9", features = ["derive"] }

[dev-dependencies]
agave-feature-set = "=4.3.0"
base64 = "0.22.1"
litesvm = "=0.18.0"
solana-account = "4.5.0"
solana-instruction = "3.5.0"
solana-keypair = "3.1.2"
solana-message = "4.5.0"
solana-program-pack = "3.1.0"
solana-rent = "4.4"
solana-signer = "3.0.1"
solana-system-interface = { version = "3.3.0", features = ["bincode"] }
solana-transaction = { version = "4.2.0", features = ["serde", "wincode"] }
spl-token-2022-interface = "3.1.0"
wincode = "0.6"
