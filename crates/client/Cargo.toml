[package]
name = "audren-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Audren Rust SDK: Multi-Base Triptych prover, router-agnostic private swap builder, institutional auditor decryptor, and standard RPC/WS scanner"

[dependencies]
aes-gcm = "0.10.3"
audren-core = { path = "../audren-core" }
bs58 = "0.5"
curve25519-dalek = { version = "=4.1.3", features = ["rand_core"] }
hkdf = "0.12"
rand = { version = "0.8.5", default-features = false, features = ["std", "std_rng", "getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-address = { version = "~2.7.0", features = ["curve25519"] }
solana-sha256-hasher = "3.1.0"
solana-zk-sdk = "=8.0.1"

[dev-dependencies]
agave-feature-set = "=4.3.0"
base64 = "0.22.1"
litesvm = "=0.18.0"
solana-account = "4.5.0"
solana-instruction = "3.5.0"
solana-keypair = "3.1.2"
solana-message = "4.5.0"
solana-program-pack = "3.1.0"
solana-rent = "4.4"
solana-signer = "3.0.1"
solana-system-interface = { version = "3.3.0", features = ["bincode"] }
solana-transaction = { version = "4.2.0", features = ["serde", "wincode"] }
spl-token-2022-interface = "3.1.0"
wincode = "0.6"
