[package]
name = "audren-circuits"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Minimal frozen BN254 Groth16 4-ary Depth-20 global MASP circuit (17,861 R1CS) and native/WASM prover for Audren."

[lib]
name = "audren_circuits"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "gen_vk"
path = "src/bin/gen_vk.rs"
required-features = ["parallel"]

[[bin]]
name = "ceremony"
path = "src/bin/ceremony.rs"
required-features = ["parallel"]

[features]
default = ["parallel"]
parallel = ["ark-groth16/parallel", "ark-bn254/std", "ark-poly/parallel"]
wasm = []

[dependencies]
ark-bn254 = { version = "=0.5.0", default-features = false, features = ["curve"] }
ark-ec = { version = "=0.5.0", default-features = false }
ark-ff = { version = "=0.5.0", default-features = false }
ark-groth16 = { version = "=0.5.0", default-features = false, features = ["std"] }
ark-poly = { version = "=0.5.0", default-features = false }
ark-r1cs-std = { version = "=0.5.0", default-features = false }
ark-relations = { version = "=0.5.1", default-features = false, features = ["std"] }
ark-serialize = { version = "=0.5.0", default-features = false, features = ["std"] }
ark-snark = { version = "=0.5.1", default-features = false }
ark-std = { version = "=0.5.0", default-features = false, features = ["std"] }
audren-core = { path = "../audren-core" }
light-poseidon = "=0.5.0"
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
zeroize = "1.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }
