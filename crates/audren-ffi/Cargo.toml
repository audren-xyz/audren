[package]
name = "audren-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "UniFFI native mobile bindings (Swift for iOS/macOS & Kotlin for Android/JVM) backed by audren-client and audren-circuits."

[lib]
name = "audren_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

[features]
default = []
bindgen-cli = ["uniffi/cli"]

[dependencies]
audren-circuits = { path = "../audren-circuits" }
audren-client = { path = "../client" }
audren-core = { path = "../audren-core" }
solana-address = { version = "~2.7.0", features = ["copy", "curve25519", "std"] }
thiserror = "2"
uniffi = "0.32.2"
zeroize = "1.9"

[dev-dependencies]
agave-feature-set = "=4.3.0"
ark-bn254 = { version = "=0.5.0", default-features = false, features = ["curve"] }
bs58 = "0.5"
litesvm = "=0.18.1"
serde_json = "1"
solana-account = "4.5.0"
solana-instruction = "3.5.0"
solana-keypair = "3.1.2"
solana-message = "4.5.0"
solana-program-pack = "3.1.0"
solana-rent = "4.4"
solana-signer = "3.0.1"
solana-system-interface = { version = "3.3.0", features = ["bincode"] }
solana-transaction = { version = "4.2.0", features = ["serde", "wincode"] }
spl-token-2022-interface = "3.1.0"
wincode = "0.6"
