[package]
name = "audren-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "UniFFI native mobile bindings (Swift for iOS/macOS & Kotlin for Android/JVM) backed by audren-client"

[lib]
name = "audren_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

[features]
default = []
bindgen-cli = ["uniffi/cli"]

[dependencies]
audren-client = { path = "../client" }
audren-core = { path = "../audren-core" }
bs58 = "0.5"
curve25519-dalek = { version = "=4.1.3", features = ["rand_core"] }
rand = { version = "0.8.5", default-features = false, features = ["std", "std_rng", "getrandom"] }
solana-address = { version = "~2.7.0", features = ["curve25519"] }
thiserror = "2"
uniffi = "0.32.2"

[dev-dependencies]
serde_json = "1"
